pre-commit:
  parallel: true
  commands:
    biome-lint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: yarn biome lint --apply {staged_files}
      stage_fixed: true

    biome-format:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json}"
      run: yarn biome format --write {staged_files}
      stage_fixed: true

    typecheck:
      glob: "*.{ts,tsx}"
      run: yarn tsc --noEmit
